apis:
- name: Turnitin Core API (TCA)
  description: >-
    RESTful API for integrating Turnitin's integrity services into third-party
    platforms — submit a document, generate a Similarity Report, and display it
    to users. Authenticates with an integration-instance API key plus the
    X-Turnitin-Integration-Name and X-Turnitin-Integration-Version headers.
    Processing is asynchronous (submit then poll). SOC2 compliant.
  humanURL: https://developers.turnitin.com/turnitin-core-api
  baseURL: https://developers.turnitin.com/turnitin-core-api
