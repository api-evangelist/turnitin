aid: turnitin
name: Turnitin
description: >-
  Turnitin is an academic and research integrity company that for more than 20
  years has provided plagiarism/similarity detection, AI-writing detection,
  online grading, and feedback tools for educators, researchers, and publishers.
  Its market-leading integrity services are exposed to third-party platforms
  through the RESTful Turnitin Core API (TCA), which lets an integrating product
  submit a document, generate a Similarity Report, and display it to users
  without leaving the host platform, plus a Learning Tools Interoperability (LTI)
  path for LMS integrations. TCA is SOC2 compliant and runs across international
  data centers. Turnitin was surfaced as a portfolio company of Norwest Venture
  Partners and enriched into the API Evangelist network from its public
  developer documentation.
